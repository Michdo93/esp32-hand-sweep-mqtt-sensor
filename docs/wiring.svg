<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L10,3 L0,6 Z" fill="#333"/>
  </marker>
</defs>
<rect width="1200" height="720" fill="white"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">ESP32 Hand Sweep MQTT Sensor</text>
<text x="600" y="75" text-anchor="middle" font-family="Arial" font-size="16">Recommended low-voltage wiring with PC817 optocoupler</text>

<rect x="50" y="130" width="220" height="150" rx="12" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
<text x="160" y="165" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">5 V DC PSU</text>
<text x="80" y="205" font-family="Arial" font-size="16">+5 V</text>
<text x="80" y="245" font-family="Arial" font-size="16">GND</text>

<rect x="350" y="110" width="270" height="210" rx="12" fill="#eef7ff" stroke="#333" stroke-width="2"/>
<text x="485" y="150" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Hand Sweep Module</text>
<text x="385" y="195" font-family="Arial" font-size="16">VCC / IN+</text>
<text x="385" y="235" font-family="Arial" font-size="16">GND / IN-</text>
<text x="385" y="275" font-family="Arial" font-size="16">OUT+</text>
<text x="385" y="305" font-family="Arial" font-size="16">OUT-</text>

<rect x="760" y="110" width="180" height="180" rx="12" fill="#fff5e6" stroke="#333" stroke-width="2"/>
<text x="850" y="150" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">PC817</text>
<text x="850" y="185" text-anchor="middle" font-family="Arial" font-size="15">Optocoupler</text>
<text x="785" y="230" font-family="Arial" font-size="15">LED input</text>
<text x="785" y="260" font-family="Arial" font-size="15">Transistor output</text>

<rect x="1010" y="100" width="150" height="220" rx="12" fill="#eaf7ea" stroke="#333" stroke-width="2"/>
<text x="1085" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">ESP32</text>
<text x="1085" y="190" text-anchor="middle" font-family="Arial" font-size="16">GPIO 27</text>
<text x="1085" y="225" text-anchor="middle" font-family="Arial" font-size="16">10 kΩ pull-up</text>
<text x="1085" y="260" text-anchor="middle" font-family="Arial" font-size="16">Wi-Fi / MQTT</text>

<line x1="270" y1="205" x2="350" y2="195" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="270" y1="245" x2="350" y2="235" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<text x="305" y="185" font-family="Arial" font-size="14">+5 V</text>
<text x="305" y="265" font-family="Arial" font-size="14">GND</text>

<line x1="620" y1="275" x2="760" y2="225" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="620" y1="305" x2="760" y2="260" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<text x="655" y="245" font-family="Arial" font-size="14">1 kΩ → PC817 LED</text>

<line x1="940" y1="210" x2="1010" y2="190" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
<text x="945" y="180" font-family="Arial" font-size="14">GPIO 27</text>

<line x1="270" y1="245" x2="1080" y2="350" stroke="#555" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow)"/>
<text x="620" y="365" font-family="Arial" font-size="14">Common low-voltage ground on the prototype</text>

<rect x="350" y="440" width="800" height="180" rx="12" fill="#fafafa" stroke="#333" stroke-width="2"/>
<text x="750" y="475" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">MQTT</text>
<text x="390" y="515" font-family="Arial" font-size="16">Wi-Fi → MQTT broker</text>
<text x="390" y="550" font-family="Arial" font-size="16">sensors/hand-sweep-01/state        ON / OFF</text>
<text x="390" y="580" font-family="Arial" font-size="16">sensors/hand-sweep-01/event        SWEEP</text>
<text x="390" y="610" font-family="Arial" font-size="16">sensors/hand-sweep-01/availability online / offline</text>

<text x="600" y="680" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Do not connect the sensor output directly to an ESP32 GPIO.</text>
</svg>
